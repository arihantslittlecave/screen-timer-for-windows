<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Screen Timer for Windows</title>
  <link rel="stylesheet" href="style.css?v=60" />
</head>
<body>
  <div class="device">
    <header class="brand">
      <span class="brand-mark">
        <!-- Three ascending bars: an at-a-glance analytics mark, not an
             abstract badge. Blue on black, per the current identity. -->
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="3" y="14" width="5" height="7" rx="1" />
          <rect x="9.5" y="9" width="5" height="12" rx="1" />
          <rect x="16" y="3" width="5" height="18" rx="1" />
        </svg>
      </span>
      <span class="brand-name">Screen Timer</span>
    </header>

    <div class="bento-row">
      <div class="bento-col">
        <div class="bento-label">Today</div>
        <div class="bento-value" id="today-value">0m</div>
        <div class="bento-sub" id="today-sub"></div>
        <div class="bento-break" id="break-row">
          Next break <span class="accent" id="break-time">in --</span>
          &nbsp;·&nbsp;
          <button class="text-link" id="snooze-btn" type="button">Snooze</button>
        </div>
      </div>
      <div class="bento-col">
        <div class="bento-label" id="month-context-label">This month</div>
        <div class="bento-value" id="avg-value">0m</div>
        <div class="bento-sub" id="month-sub">per day</div>
      </div>
    </div>

    <section class="tile">
      <div class="tile-header">
        <span class="tile-title">History</span>
        <div class="month-nav">
          <button class="chev" id="month-prev" type="button" aria-label="Previous month">&#8249;</button>
          <span class="month-label" id="month-label">—</span>
          <button class="chev" id="month-next" type="button" aria-label="Next month">&#8250;</button>
        </div>
      </div>

      <div class="cal-weekdays">
        <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </section>

    <section class="tile">
      <div class="apps-scope">
        <button class="text-link active" id="scope-day" type="button">Today</button>
        <button class="text-link" id="scope-month" type="button">This month</button>
        <span class="apps-total" id="apps-total"></span>
      </div>
      <div id="app-list"></div>
      <button class="text-link see-more hidden" id="show-more-apps" type="button"></button>
    </section>

    <section class="tile">
      <div class="setting-row">
        <span class="setting-label">Break every</span>
        <div class="text-options" id="break-segment" data-value="30">
          <button class="text-link" type="button" data-value="15">15m</button>
          <button class="text-link" type="button" data-value="30">30m</button>
          <button class="text-link" type="button" data-value="45">45m</button>
          <button class="text-link" type="button" data-value="60">60m</button>
          <button class="text-link" type="button" data-value="90">90m</button>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">Daily limit</span>
        <select class="select-input" id="goal-select"></select>
      </div>
      <div class="save-status" id="save-status"></div>
    </section>
  </div>
  <script src="app.js?v=60"></script>
</body>
</html>
